<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Five-zone underground expedition map</title>
  <desc id="desc">A fictional dark amber map showing a route through five subterranean zones, progress nodes, survey notes, and a compact inventory panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b0b08"/>
      <stop offset=".55" stop-color="#19140d"/>
      <stop offset="1" stop-color="#2b180d"/>
    </linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#142018"/>
      <stop offset=".52" stop-color="#11130f"/>
      <stop offset="1" stop-color="#22150d"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#52a95c"/>
      <stop offset=".52" stop-color="#ffc53d"/>
      <stop offset="1" stop-color="#ff6b2c"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#a78a4c" stroke-opacity=".08"/>
      <path d="M22 0V44M0 22H44" stroke="#a78a4c" stroke-opacity=".025"/>
    </pattern>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0V12" stroke="#d9a734" stroke-opacity=".09" stroke-width="3"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="240" cy="160" r="260" fill="#4aa95b" fill-opacity=".035"/>
  <circle cx="1210" cy="680" r="340" fill="#ff6b2c" fill-opacity=".045"/>
  <g filter="url(#shadow)">
    <rect x="70" y="58" width="1460" height="784" rx="28" fill="#100e0a" stroke="#4e3e27" stroke-width="2"/>
  </g>
  <path d="M70 145H1530M1164 145V842" stroke="#463824"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="112" y="105" fill="#f3ead6" font-size="22" font-weight="700" letter-spacing="4">SURVEY ROUTE // EMBER SHAFT</text>
    <text x="112" y="128" fill="#8f836c" font-size="12" letter-spacing="3">FIVE ZONES · ONE RETURN WINDOW</text>
    <rect x="1320" y="84" width="166" height="36" rx="18" fill="#182419" stroke="#306139"/>
    <circle cx="1344" cy="102" r="5" fill="#67ce70" filter="url(#glow)"/>
    <text x="1362" y="108" fill="#a9dcae" font-size="13" letter-spacing="2">SYNCED</text>
  </g>

  <!-- mapped terrain -->
  <rect x="96" y="170" width="1042" height="646" rx="18" fill="url(#map)" stroke="#3e3525"/>
  <rect x="96" y="170" width="1042" height="646" rx="18" fill="url(#grid)"/>
  <rect x="96" y="170" width="1042" height="646" rx="18" fill="url(#hatch)" opacity=".7"/>
  <g fill="none" stroke-linecap="round">
    <path d="M112 300C232 239 310 275 413 226S622 207 713 269 882 324 1122 232" stroke="#66705a" stroke-opacity=".28" stroke-width="2"/>
    <path d="M109 654C254 580 355 615 449 564s179-73 277-7 209 109 400 30" stroke="#7f5d31" stroke-opacity=".35" stroke-width="2"/>
    <path d="M223 184c-24 113 17 185-43 264S132 653 198 801M462 177c11 119-55 189-14 298s-1 209-59 331M846 179c-42 104-6 168 48 240s34 181-13 385" stroke="#7f7457" stroke-opacity=".13" stroke-width="2"/>
    <path d="M110 430c101-13 150 34 255 8s196-85 294-41 183 97 462 49" stroke="#8d7c58" stroke-opacity=".15" stroke-width="8"/>
  </g>

  <!-- terrain masses -->
  <g fill="#1f2a1e" stroke="#35523a" stroke-opacity=".65">
    <path d="M123 228l89-39 107 20 54 76-34 97-116 28-105-75z"/>
    <path d="M297 470l84-73 125 15 68 85-32 97-105 53-121-57z"/>
  </g>
  <g fill="#2c2417" stroke="#594624" stroke-opacity=".65">
    <path d="M485 196l141-18 97 66-20 99-137 32-97-72z"/>
    <path d="M694 436l130-65 109 32 66 99-46 95-128 31-124-70z"/>
  </g>
  <g fill="#342018" stroke="#663d23" stroke-opacity=".72">
    <path d="M856 204l120-21 136 65 3 108-81 79-139-26-62-98z"/>
    <path d="M904 618l94-55 114 31 21 95-78 101-120-6-63-86z"/>
  </g>

  <!-- route -->
  <path d="M197 681C249 601 274 504 353 471S472 413 515 323 670 246 739 344 754 485 851 515s144 2 201 93" fill="none" stroke="#080807" stroke-width="16" stroke-linecap="round"/>
  <path d="M197 681C249 601 274 504 353 471S472 413 515 323 670 246 739 344 754 485 851 515s144 2 201 93" fill="none" stroke="url(#path)" stroke-width="6" stroke-linecap="round" stroke-dasharray="13 9"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g transform="translate(197 681)">
      <circle r="31" fill="#132018" stroke="#59b565" stroke-width="4"/>
      <circle r="10" fill="#64c86d" filter="url(#glow)"/>
      <text x="-55" y="58" fill="#b8d9b8" font-size="14" font-weight="700">01 GREEN GATE</text>
    </g>
    <g transform="translate(353 471)">
      <circle r="31" fill="#182217" stroke="#79b85a" stroke-width="4"/>
      <path d="M-9 1l7 8 14-18" fill="none" stroke="#aee17c" stroke-width="5"/>
      <text x="-60" y="58" fill="#c3d6a7" font-size="14" font-weight="700">02 MOSS WORKS</text>
    </g>
    <g transform="translate(515 323)">
      <circle r="31" fill="#282214" stroke="#d8aa36" stroke-width="4"/>
      <path d="M-9 1l7 8 14-18" fill="none" stroke="#ffd665" stroke-width="5"/>
      <text x="-60" y="58" fill="#efd795" font-size="14" font-weight="700">03 OLD LIFT</text>
    </g>
    <g transform="translate(739 344)">
      <circle r="37" fill="#2c2113" stroke="#ffc53d" stroke-width="5" filter="url(#glow)"/>
      <path d="M-12 0l12-14 12 14-12 15z" fill="#ffc53d"/>
      <text x="-70" y="68" fill="#ffd970" font-size="14" font-weight="700">04 AMBER VAULT</text>
      <rect x="-77" y="78" width="155" height="20" rx="10" fill="#2a2216" stroke="#5b4724"/>
      <rect x="-73" y="82" width="91" height="12" rx="6" fill="#ffc53d"/>
      <text x="0" y="118" fill="#9e8d6b" font-size="12" text-anchor="middle">58% SURVEYED</text>
    </g>
    <g transform="translate(1052 608)">
      <circle r="31" fill="#281710" stroke="#b75029" stroke-width="4" stroke-dasharray="7 6"/>
      <path d="M-10 10l20-20M-10-10l20 20" stroke="#dc6c38" stroke-width="4"/>
      <text x="-76" y="58" fill="#d99876" font-size="14" font-weight="700">05 CINDER WELL</text>
    </g>
  </g>

  <!-- annotations -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <path d="M238 299h103l31 23" fill="none" stroke="#64745e"/>
    <text x="238" y="288" fill="#7f9c82" letter-spacing="2">COOL AIR</text>
    <path d="M808 228h91l28 20" fill="none" stroke="#8e6e38"/>
    <text x="808" y="217" fill="#ad8b4c" letter-spacing="2">FRACTURED</text>
    <path d="M638 682h125l28-26" fill="none" stroke="#8e6e38"/>
    <text x="638" y="703" fill="#ad8b4c" letter-spacing="2">CACHE MARK</text>
    <circle cx="268" cy="298" r="5" fill="#63bd6a"/><circle cx="840" cy="228" r="5" fill="#ffc53d"/><circle cx="679" cy="681" r="5" fill="#ffc53d"/>
  </g>

  <!-- side inventory -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="1204" y="192" fill="#8f836c" font-size="13" letter-spacing="3">FIELD INVENTORY</text>
    <text x="1488" y="192" fill="#ffc53d" font-size="13" text-anchor="end">08 / 12</text>
    <rect x="1198" y="216" width="290" height="7" rx="3" fill="#2b2418"/>
    <rect x="1198" y="216" width="194" height="7" rx="3" fill="#d9a734"/>

    <g transform="translate(1198 253)">
      <rect width="136" height="120" rx="12" fill="#1c1812" stroke="#4b3d26"/>
      <rect x="14" y="14" width="108" height="70" rx="8" fill="#11140f" stroke="#35523a"/>
      <path d="M57 65l12-36 13 36-13 11z" fill="#66bd6c"/><path d="M69 29v47" stroke="#b9e8bc" stroke-opacity=".45"/>
      <text x="14" y="104" fill="#cbbda3" font-size="12">MOSS LAMP</text><text x="118" y="104" fill="#63c56b" font-size="12" text-anchor="end">91%</text>
    </g>
    <g transform="translate(1352 253)">
      <rect width="136" height="120" rx="12" fill="#1c1812" stroke="#4b3d26"/>
      <rect x="14" y="14" width="108" height="70" rx="8" fill="#17130e" stroke="#5d4828"/>
      <path d="M42 64l27-32 27 32-27 13z" fill="#ffc53d"/><path d="M69 32v45" stroke="#fff0a8" stroke-opacity=".45"/>
      <text x="14" y="104" fill="#cbbda3" font-size="12">SUN FLARE</text><text x="118" y="104" fill="#ffc53d" font-size="12" text-anchor="end">x3</text>
    </g>
    <g transform="translate(1198 391)">
      <rect width="136" height="120" rx="12" fill="#1c1812" stroke="#4b3d26"/>
      <rect x="14" y="14" width="108" height="70" rx="8" fill="#17130e" stroke="#5d4828"/>
      <path d="M41 67h56l-8-27H49z" fill="#b47c2d"/><path d="M55 40l5-13h18l5 13" fill="none" stroke="#e1b65c" stroke-width="6"/>
      <text x="14" y="104" fill="#cbbda3" font-size="12">ANCHOR KIT</text><text x="118" y="104" fill="#ffc53d" font-size="12" text-anchor="end">x2</text>
    </g>
    <g transform="translate(1352 391)">
      <rect width="136" height="120" rx="12" fill="#1c1812" stroke="#4b3d26"/>
      <rect x="14" y="14" width="108" height="70" rx="8" fill="#1c120e" stroke="#623a24"/>
      <path d="M69 25c20 21 24 32 0 51-24-19-20-30 0-51z" fill="#dc6430"/><path d="M69 38c10 12 11 19 0 28-11-9-10-16 0-28z" fill="#ffc53d"/>
      <text x="14" y="104" fill="#cbbda3" font-size="12">HEAT VIAL</text><text x="118" y="104" fill="#ff8150" font-size="12" text-anchor="end">x4</text>
    </g>

    <rect x="1198" y="533" width="290" height="112" rx="12" fill="#17130e" stroke="#403522"/>
    <text x="1216" y="560" fill="#8f836c" font-size="12" letter-spacing="2">MISSION LOAD</text>
    <text x="1216" y="595" fill="#f3ead6" font-size="24" font-weight="700">37.4 KG</text>
    <text x="1468" y="595" fill="#d9a734" font-size="14" text-anchor="end">LIMIT 48</text>
    <rect x="1216" y="615" width="252" height="8" rx="4" fill="#2c2418"/><rect x="1216" y="615" width="196" height="8" rx="4" fill="url(#path)"/>

    <rect x="1198" y="665" width="290" height="118" rx="12" fill="#1f160f" stroke="#633c24"/>
    <path d="M1225 714l17-29 17 29z" fill="none" stroke="#ff6b2c" stroke-width="3"/>
    <path d="M1242 696v8M1242 709v2" stroke="#ffb089" stroke-width="3"/>
    <text x="1277" y="699" fill="#ff9a6b" font-size="12" letter-spacing="2">ROUTE WARNING</text>
    <text x="1277" y="724" fill="#f3ead6" font-size="14">ZONE 05 UNSTABLE</text>
    <text x="1218" y="758" fill="#9f816d" font-size="12">Return beacon reserved</text>
  </g>
  <rect x="70" y="58" width="1460" height="784" rx="28" fill="none" stroke="#74562b" stroke-opacity=".65" stroke-width="2"/>
</svg>
